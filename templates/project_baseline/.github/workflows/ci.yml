name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configuração de Runtime (Ajustar de acordo com a stack: Node.js, Python, Go, etc.)
      - name: Setup Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 1. Install
      - name: Install Dependencies
        run: npm ci

      # 2. Lint & Format Check
      - name: Run Linter & Formatter
        run: npm run lint

      # 3. Test (mínimo smoke test)
      - name: Run Automated Tests
        run: npm test

      # 4. Build
      - name: Build Project
        run: npm run build
