steps:
  # 1. Validação de Qualidade e Testes Python
  - name: 'python:3.12-slim'
    id: 'python-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        pip install -e ".[dev]"
        ruff check .
        pytest tests -v --tb=short

  # 2. Testes Unitários Go (Customer Issue Reviewer Agent)
  - name: 'golang:1.24'
    id: 'go-tests'
    dir: 'projects/customer_issue_reviewer_go'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go test ./tests -v

  # 3. Validação dos Frontends (KeepDocs Workspace, PrescMed PCM, Canvas IDE)
  - name: 'node:20-slim'
    id: 'frontend-build-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Build KeepDocs Workspace ==="
        cd projects/keepdocs-workspace && npm install --no-audit && npm run build
        cd ../..
        echo "=== Build PrescMed PCM ==="
        cd projects/pcm && npm install --no-audit && npm run build
        cd ../..
        echo "=== Build Canvas IDE ==="
        cd projects/canvas_ide && npm install --no-audit && npm run build

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
