name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint & Code Style (Ruff)
        run: >
          uv run ruff check
          agents
          ecosystem_healthcheck.py
          tests/unit/test_code_consistency_specialist.py
          tests/unit/test_custom_agents_healthcheck.py
          tests/unit/test_ecosystem_healthcheck.py
          tests/unit/test_headless_runner.py
          tests/unit/test_html_output.py
          tests/unit/test_plugins_and_skills_spec.py
          tests/unit/test_repository_git_hygiene.py
          tests/unit/test_skills_healthcheck.py

      - name: Skill Catalog Healthcheck
        run: uv run python skills/skill_healthcheck.py

      - name: Automated Tests (Pytest)
        run: >
          uv run pytest
          tests/unit/test_code_consistency_specialist.py
          tests/unit/test_custom_agents_healthcheck.py
          tests/unit/test_ecosystem_healthcheck.py
          tests/unit/test_headless_runner.py
          tests/unit/test_html_output.py
          tests/unit/test_plugins_and_skills_spec.py
          tests/unit/test_repository_git_hygiene.py
          tests/unit/test_skills_healthcheck.py
          -v --tb=short --basetemp=/tmp/pytest_tmp
