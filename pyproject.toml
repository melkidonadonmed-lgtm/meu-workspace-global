[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meu-workspace-global"
version = "1.0.0"
description = "Repositório Global Unificado para Agentes Autônomos e Skills Modulares"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipe de Arquitetura de IA", email = "ai-arch@empresa.com" }
]
dependencies = [
    "google-genai>=2.3.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "duckduckgo_search>=6.0.0",
    "playwright>=1.40.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-adk>=2.8.0",
    "google-antigravity>=0.1.13",
    "mcp>=1.3.0",
    "fastmcp>=0.4.0",
    "sentencepiece>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "shared", "skills"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
tmp_path_retention_count = 0
addopts = "--basetemp=C:/Users/melki/.pytest_temp"

[tool.ruff]
line-length = 100
target-version = "py311"
# Código vendorado/legado fora da governança de lint do núcleo
extend-exclude = [
    "skills/deep-research-hub/notebooklm",
    "inbox",
    ".agents",
]
