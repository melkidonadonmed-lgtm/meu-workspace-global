[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-visual-auditor"
version = "0.1.0"
description = "Auditoria visual, regressão pixel a pixel e inspeção geométrica do DOM com agentes modulares"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipe de Arquitetura de IA", email = "ai-arch@empresa.com" }
]
dependencies = [
    "pydantic>=2.8.0",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo_search>=6.0.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
web-visual-auditor = "web_visual_auditor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["web_visual_auditor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
