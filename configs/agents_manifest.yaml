version: "1.1.0"
environment: "development"

global_settings:
  default_model: "gemini-3.7-flash"
  fallback_model: "gemini-3.5-flash-lite"
  reasoning_model: "gemini-3.1-pro-preview"
  max_context_tokens: 1000000
  token_budget_per_turn: 50000
  temperature: 0.2
  top_p: 0.95
  timeout_seconds: 60
  gcp_project_id: "agent-md-506215"
  gcp_region: "us-central1"

orchestrator:
  name: "MasterOrchestrator"
  description: "Orquestrador Stateful central de tarefas e delegação especializada"
  model: "gemini-3.7-flash"
  stateful: true
  session_storage: "in_memory" # Suporta in_memory, redis, sqlite
  allowed_subagents:
    - "sql_specialist"
    - "workspace_specialist"
    - "security_guard"
    - "html_modular_specialist"
    - "research_evolution_specialist"
    - "customer_issue_reviewer"
    - "code_consistency_specialist"
  tools_enabled:
    - "mcp_tool_execution"
    - "skill_injection"

specialized_agents:
  research_evolution_specialist:
    name: "ResearchEvolutionSpecialistAgent"
    description: "Especialista stateless em pesquisa web técnica aprofundada, defesas anti-injeção e evolução do workspace"
    model: "gemini-3.7-flash"
    stateless: true
    max_tokens_output: 8192
    temperature: 0.2

  html_modular_specialist:
    name: "HTMLModularSpecialistAgent"
    description: "Especialista stateless em montagem de páginas HTML5 modular, Atomic Design e WCAG 2.1 AA"
    model: "gemini-3.7-flash"
    stateless: true
    max_tokens_output: 8192
    temperature: 0.2

  sql_specialist:
    name: "SqlSpecialistAgent"
    description: "Especialista stateless em consultas, schemas e otimizações SQL no BigQuery"
    model: "gemini-3.7-flash"
    stateless: true
    max_tokens_output: 8192
    temperature: 0.1
    mcp_tools:
      - "bigquery_execute_query"
      - "bigquery_get_schema"

  workspace_specialist:
    name: "WorkspaceSpecialistAgent"
    description: "Especialista stateless em inspeção de arquivos, Google Drive, Calendar e Storage"
    model: "gemini-3.7-flash"
    stateless: true
    max_tokens_output: 8192
    temperature: 0.1
    mcp_tools:
      - "list_workspace_documents"
      - "get_document_content"
      - "list_upcoming_calendar_events"
      - "list_storage_files"

  security_guard:
    name: "SecurityGuardAgent"
    description: "Guardrail Zero-Trust para sanitização de prompts e detecção de PII"
    model: "gemini-3.5-flash-lite"
    stateless: true
    max_tokens_output: 2048
    temperature: 0.0

  customer_issue_reviewer:
    name: "CustomerIssueReviewerAgent"
    description: "Especialista em revisão e triagem de chamados, incidentes e bugs de clientes via Google ADK Go v2"
    model: "gemini-3.7-flash"
    stateless: true
    max_tokens_output: 8192
    temperature: 0.1

  code_consistency_specialist:
    name: "CodeConsistencySpecialistAgent"
    description: "Especialista em análise contínua de código, anti-drift de arquitetura e sincronização periódica de contexto a cada X steps"
    model: "gemini-3.7-flash"
    stateless: true
    max_tokens_output: 8192
    temperature: 0.1

  antigravity_bridge:
    name: "AntigravityAgentBridge"
    description: "Agente oficial integrado com o Google Antigravity SDK e ferramentas locais"
    model: "gemini-3.7-flash"
    stateless: false
    max_tokens_output: 8192
    temperature: 0.2
    tools_enabled:
      - "list_workspace_files"
      - "read_workspace_file"
      - "execute_sql_query"
      - "get_system_health"
